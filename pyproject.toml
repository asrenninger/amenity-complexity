[project]
name = "amenity-complexity"
version = "0.1.0"
description = "Tools for computing amenity complexity in regions using Foursquare/Overture data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Andrew Renninger"},
    {name = "Sándor Juhász"},
]
keywords = [
    "amenity complexity",
    "economic complexity",
    "urban analytics",
    "points of interest",
    "geospatial",
    "H3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "h3>=3.7.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
    "click>=8.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
analysis = [
    "seaborn>=0.12.0",
    "contextily>=1.3.0",
    "mapclassify>=2.5.0",
    "networkx>=3.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "folium>=0.14.0",
]

[project.scripts]
amenity-complexity = "amenity_complexity.cli:main"

[project.urls]
Homepage = "https://github.com/arenninger/amenity-complexity"
Repository = "https://github.com/arenninger/amenity-complexity"
Issues = "https://github.com/arenninger/amenity-complexity/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
